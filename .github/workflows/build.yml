name: build

on: [push, pull_request]

env:
  pgbackrest_completion_version: "v0.11"
  pgbackrest_old_completion_version: "v0.10"
  pgbackrest_completion_switch_version: "2.56.0"
  build_platforms: "linux/amd64,linux/arm64"

jobs:
  build_image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        pgbackrest_version: ["2.55.1", "2.56.0", "2.57.0", "2.58.0", "2.59.0"]
    env: 
      latest_version: "2.59.0"
      dist_build_version: "2.59.0"
      source_archive_download_url: "https://github.com/pgbackrest/pgbackrest/archive/release"
      dist_download_url: "https://github.com/pgbackrest/pgbackrest/releases/download/release"
    steps:
    - uses: actions/checkout@v7

    - name: Get repo tag
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      id: vars
      run: |
        echo "repo_tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Available platforms
      run: echo ${BUILDX_PLATFORMS}
      env:
        BUILDX_PLATFORMS: ${{ steps.buildx.outputs.platforms }}

    - name: Set pgBackRest build variables
      id: build_vars
      run: |
        VERSION="${TAG%%_*}"

        if [ "$(printf '%s\n%s\n' "${TAG}" "${DIST_BUILD_VERSION}" | sort -V | head -n1)" = "${TAG}" ] && [ "${TAG}" != "${DIST_BUILD_VERSION}" ]; then
          echo "dockerfile=Dockerfile_source_archive" >> "${GITHUB_OUTPUT}"
          echo "dockerfile_alpine=Dockerfile_source_archive.alpine" >> "${GITHUB_OUTPUT}"
          echo "download_url=${SOURCE_ARCHIVE_DOWNLOAD_URL}" >> "${GITHUB_OUTPUT}"
        else
          echo "dockerfile=Dockerfile" >> "${GITHUB_OUTPUT}"
          echo "dockerfile_alpine=Dockerfile.alpine" >> "${GITHUB_OUTPUT}"
          echo "download_url=${DIST_DOWNLOAD_URL}" >> "${GITHUB_OUTPUT}"
        fi

        if [ "$(printf '%s\n%s\n' "${VERSION}" "${COMPLETION_SWITCH_VERSION}" | sort -V | head -n1)" = "${VERSION}" ] && [ "${VERSION}" != "${COMPLETION_SWITCH_VERSION}" ]; then
          echo "completion_version=${OLD_COMPLETION_VERSION}" >> "${GITHUB_OUTPUT}"
        else
          echo "completion_version=${COMPLETION_VERSION}" >> "${GITHUB_OUTPUT}"
        fi
      env:
        TAG: ${{ matrix.pgbackrest_version }}
        DIST_BUILD_VERSION: ${{ env.dist_build_version }}
        SOURCE_ARCHIVE_DOWNLOAD_URL: ${{ env.source_archive_download_url }}
        DIST_DOWNLOAD_URL: ${{ env.dist_download_url }}
        COMPLETION_VERSION: ${{ env.pgbackrest_completion_version }}
        OLD_COMPLETION_VERSION: ${{ env.pgbackrest_old_completion_version }}
        COMPLETION_SWITCH_VERSION: ${{ env.pgbackrest_completion_switch_version }}

    - name: Build pgbackrest image
      run: |
        docker buildx build \
          -f ${DOCKERFILE} \
          --platform ${BUILD_PLATFORMS} \
          --build-arg BACKREST_VERSION=${TAG} \
          --build-arg REPO_BUILD_TAG=${REPO_TAG} \
          --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
          --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
          -t pgbackrest:${TAG} .
      env: 
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOCKERFILE: ${{ steps.build_vars.outputs.dockerfile }}
        DOWNLOAD_URL: ${{ steps.build_vars.outputs.download_url }}

    - name: Build pgbackrest alpine image
      run: |
        docker buildx build \
          -f ${DOCKERFILE} \
          --platform ${BUILD_PLATFORMS} \
          --build-arg BACKREST_VERSION=${TAG} \
          --build-arg REPO_BUILD_TAG=${REPO_TAG} \
          --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
          --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
          -t pgbackrest:${TAG}-alpine .
      env: 
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOCKERFILE: ${{ steps.build_vars.outputs.dockerfile_alpine }}
        DOWNLOAD_URL: ${{ steps.build_vars.outputs.download_url }}

    - name: Build image and push tag to ghcr.io and Docker Hub
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        echo ${GITHUB_PKG} | docker login ghcr.io -u ${GITHUB_USER} --password-stdin
        echo ${DOCKERHUB_PKG} | docker login -u ${DOCKERHUB_USER} --password-stdin
        docker buildx build --push \
            -f ${DOCKERFILE} \
            --platform ${BUILD_PLATFORMS} \
            --build-arg BACKREST_VERSION=${TAG} \
            --build-arg REPO_BUILD_TAG=${REPO_TAG} \
            --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
            --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:${TAG} \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:${TAG}-${REPO_TAG} \
            -t ${DOCKERHUB_USER}/pgbackrest:${TAG} \
            -t ${DOCKERHUB_USER}/pgbackrest:${TAG}-${REPO_TAG} .
      env:
        GITHUB_USER: ${{ github.actor }}
        GITHUB_PKG: ${{ secrets.GUTHUB_CR_PAT }}
        DOCKERHUB_USER: ${{ secrets.DOCKEHUB_USER }}
        DOCKERHUB_PKG: ${{ secrets.DOCKEHUB_TOKEN }}
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOCKERFILE: ${{ steps.build_vars.outputs.dockerfile }}
        DOWNLOAD_URL: ${{ steps.build_vars.outputs.download_url }}

    - name: Build alpine image and push tag to ghcr.io and Docker Hub
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        echo ${GITHUB_PKG} | docker login ghcr.io -u ${GITHUB_USER} --password-stdin
        echo ${DOCKERHUB_PKG} | docker login -u ${DOCKERHUB_USER} --password-stdin
        docker buildx build --push \
            -f ${DOCKERFILE} \
            --platform ${BUILD_PLATFORMS} \
            --build-arg BACKREST_VERSION=${TAG} \
            --build-arg REPO_BUILD_TAG=${REPO_TAG} \
            --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
            --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:${TAG}-alpine \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:${TAG}-alpine-${REPO_TAG} \
            -t ${DOCKERHUB_USER}/pgbackrest:${TAG}-alpine \
            -t ${DOCKERHUB_USER}/pgbackrest:${TAG}-alpine-${REPO_TAG} .
      env:
        GITHUB_USER: ${{ github.actor }}
        GITHUB_PKG: ${{ secrets.GUTHUB_CR_PAT }}
        DOCKERHUB_USER: ${{ secrets.DOCKEHUB_USER }}
        DOCKERHUB_PKG: ${{ secrets.DOCKEHUB_TOKEN }}
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOCKERFILE: ${{ steps.build_vars.outputs.dockerfile_alpine }}
        DOWNLOAD_URL: ${{ steps.build_vars.outputs.download_url }}

    - name: Build image and push tag (latest) to ghcr.io and Docker Hub
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.pgbackrest_version == env.latest_version
      run: |
        echo ${GITHUB_PKG} | docker login ghcr.io -u ${GITHUB_USER} --password-stdin
        echo ${DOCKERHUB_PKG} | docker login -u ${DOCKERHUB_USER} --password-stdin
        docker buildx build --push \
            -f ${DOCKERFILE} \
            --platform ${BUILD_PLATFORMS} \
            --build-arg BACKREST_VERSION=${TAG} \
            --build-arg REPO_BUILD_TAG=${REPO_TAG} \
            --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
            --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:latest \
            -t ${DOCKERHUB_USER}/pgbackrest:latest .
      env:
        GITHUB_USER: ${{ github.actor }}
        GITHUB_PKG: ${{ secrets.GUTHUB_CR_PAT }}
        DOCKERHUB_USER: ${{ secrets.DOCKEHUB_USER }}
        DOCKERHUB_PKG: ${{ secrets.DOCKEHUB_TOKEN }}
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOCKERFILE: ${{ steps.build_vars.outputs.dockerfile }}
        DOWNLOAD_URL: ${{ steps.build_vars.outputs.download_url }}

  build_gpdb_image:
    # GPDB fork builds use GitHub source archives, while the default Dockerfile expects upstream distribution tarballs.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        pgbackrest_version: ["2.52_arenadata12", "2.54_arenadata14"]
    env: 
      download_url: "https://github.com/arenadata/pgbackrest/archive"
    steps:
    - uses: actions/checkout@v7

    - name: Get repo tag
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      id: vars
      run: |
        echo "repo_tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Available platforms
      run: echo ${BUILDX_PLATFORMS}
      env:
        BUILDX_PLATFORMS: ${{ steps.buildx.outputs.platforms }}

    - name: Set pgBackRest GPDB build variables
      id: gpdb_build_vars
      run: |
        VERSION="${TAG%%_*}"

        if [ "$(printf '%s\n%s\n' "${VERSION}" "${COMPLETION_SWITCH_VERSION}" | sort -V | head -n1)" = "${VERSION}" ] && [ "${VERSION}" != "${COMPLETION_SWITCH_VERSION}" ]; then
          echo "completion_version=${OLD_COMPLETION_VERSION}" >> "${GITHUB_OUTPUT}"
        else
          echo "completion_version=${COMPLETION_VERSION}" >> "${GITHUB_OUTPUT}"
        fi
      env:
        TAG: ${{ matrix.pgbackrest_version }}
        COMPLETION_VERSION: ${{ env.pgbackrest_completion_version }}
        OLD_COMPLETION_VERSION: ${{ env.pgbackrest_old_completion_version }}
        COMPLETION_SWITCH_VERSION: ${{ env.pgbackrest_completion_switch_version }}

    - name: Build pgbackrest gpdb image
      run: |
        IMAGE_TAG="$(echo ${TAG} | cut -d_ -f1)-gpdb"
        docker buildx build \
          -f Dockerfile_source_archive \
          --platform ${BUILD_PLATFORMS} \
          --build-arg BACKREST_VERSION=${TAG} \
          --build-arg REPO_BUILD_TAG=${REPO_TAG} \
          --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
          --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
          -t pgbackrest:${IMAGE_TAG} .
      env: 
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.gpdb_build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOWNLOAD_URL: ${{ env.download_url }}

    - name: Build pgbackrest gpdb alpine image
      run: |
        IMAGE_TAG="$(echo ${TAG} | cut -d_ -f1)-gpdb"
        docker buildx build \
          -f Dockerfile_source_archive.alpine \
          --platform ${BUILD_PLATFORMS} \
          --build-arg BACKREST_VERSION=${TAG} \
          --build-arg REPO_BUILD_TAG=${REPO_TAG} \
          --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
          --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
          -t pgbackrest:${IMAGE_TAG}-alpine .
      env: 
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.gpdb_build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOWNLOAD_URL: ${{ env.download_url }}

    - name: Build gpdb image and push tag to ghcr.io and Docker Hub
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        echo ${GITHUB_PKG} | docker login ghcr.io -u ${GITHUB_USER} --password-stdin
        echo ${DOCKERHUB_PKG} | docker login -u ${DOCKERHUB_USER} --password-stdin
        IMAGE_TAG="$(echo ${TAG} | cut -d_ -f1)-gpdb"
        docker buildx build --push \
            -f Dockerfile_source_archive \
            --platform ${BUILD_PLATFORMS} \
            --build-arg BACKREST_VERSION=${TAG} \
            --build-arg REPO_BUILD_TAG=${REPO_TAG} \
            --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
            --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:${IMAGE_TAG} \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:${IMAGE_TAG}-${REPO_TAG} \
            -t ${DOCKERHUB_USER}/pgbackrest:${IMAGE_TAG} \
            -t ${DOCKERHUB_USER}/pgbackrest:${IMAGE_TAG}-${REPO_TAG} .
      env:
        GITHUB_USER: ${{ github.actor }}
        GITHUB_PKG: ${{ secrets.GUTHUB_CR_PAT }}
        DOCKERHUB_USER: ${{ secrets.DOCKEHUB_USER }}
        DOCKERHUB_PKG: ${{ secrets.DOCKEHUB_TOKEN }}
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.gpdb_build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOWNLOAD_URL: ${{ env.download_url }}

    - name: Build gpdb alpine image and push tag to ghcr.io and Docker Hub
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        echo ${GITHUB_PKG} | docker login ghcr.io -u ${GITHUB_USER} --password-stdin
        echo ${DOCKERHUB_PKG} | docker login -u ${DOCKERHUB_USER} --password-stdin
        IMAGE_TAG="$(echo ${TAG} | cut -d_ -f1)-gpdb"
        docker buildx build --push \
            -f Dockerfile_source_archive.alpine \
            --platform ${BUILD_PLATFORMS} \
            --build-arg BACKREST_VERSION=${TAG} \
            --build-arg REPO_BUILD_TAG=${REPO_TAG} \
            --build-arg BACKREST_COMPLETION_VERSION=${COMPL_TAG} \
            --build-arg BACKREST_DOWNLOAD_URL=${DOWNLOAD_URL} \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:${IMAGE_TAG}-alpine \
            -t ghcr.io/${GITHUB_USER}/pgbackrest:${IMAGE_TAG}-alpine-${REPO_TAG} \
            -t ${DOCKERHUB_USER}/pgbackrest:${IMAGE_TAG}-alpine \
            -t ${DOCKERHUB_USER}/pgbackrest:${IMAGE_TAG}-alpine-${REPO_TAG} .
      env:
        GITHUB_USER: ${{ github.actor }}
        GITHUB_PKG: ${{ secrets.GUTHUB_CR_PAT }}
        DOCKERHUB_USER: ${{ secrets.DOCKEHUB_USER }}
        DOCKERHUB_PKG: ${{ secrets.DOCKEHUB_TOKEN }}
        TAG: ${{ matrix.pgbackrest_version }}
        REPO_TAG: ${{ steps.vars.outputs.repo_tag }}
        COMPL_TAG: ${{ steps.gpdb_build_vars.outputs.completion_version }}
        BUILD_PLATFORMS: ${{ env.build_platforms }}
        DOWNLOAD_URL: ${{ env.download_url }}
